<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <title>モーションパル · 顔と上半身のトラッキング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="menu" class="menu" aria-labelledby="menu-title">
    <nav class="menu-brand"><span>モーションパル<span class="brand-dot">●</span></span><span class="edition">AR キャラクター</span></nav>
    <div class="menu-intro"><span class="menu-kicker">あなたの動きで、命をふきこもう。</span>
      <h1 id="menu-title" tabindex="-1">今日は、<br>だれになろう？<span>✳</span></h1>
      <p>お気に入りをタップして、ARの世界へ。<br>まばたきも、笑顔も、腕の動きもいっしょに。</p>
    </div>
    <div class="collection-heading"><h2>キャラクターを選ぶ</h2><span id="character-count"></span></div>
    <div id="characters" class="characters"></div>
    <footer class="menu-footer"><span>01 選ぶ</span><span>02 カメラを許可</span><span>03 動いてあそぶ</span><p>カメラ映像は端末内で処理されます。</p></footer>
  </section>
  <main id="ar" hidden>
    <video id="camera" autoplay muted playsinline aria-label="左右反転したカメラ映像"></video>
    <canvas id="overlay" aria-label="顔と上半身の動きに連動するキャラクター"></canvas>
    <header>
      <div><span class="eyebrow">動きであそぼう</span><h1 id="character-name">モーションパル</h1></div>
      <div class="ar-actions"><button id="back">キャラクター変更</button><button id="debug" aria-pressed="false">追跡ポイント</button></div>
    </header>
    <section class="panel" aria-label="カメラ操作">
      <div class="readout"><span id="status" role="status">準備はいいですか？</span><span id="fps">— FPS</span></div>
      <p>片目ずつまばたきをしたり、口を開けたりしてみましょう。イラストが表情に合わせて動きます。腕も映るように少し離れてください。</p>
      <button id="start" class="primary">カメラを開始</button>
      <small>カメラ映像はお使いの端末内で処理されます。</small>
    </section>
  </main>
  <script type="module" src="app.js?v=menu-2"></script>
</body>
</html>
